name: ci

on:
  # BRANCH pushes only. A semver TAG push rebuilds a SHA a branch push already
  # built: across this repo's whole history that happened 66/66 times, and a tag
  # run has never once reported a fact its branch run did not (#99 B-1) — the one
  # non-green tag run failed at the same step as its main run, two seconds later.
  # The exact-SHA evidence a release quotes IS the branch run, which is also the
  # run `entwurf-release` land mode reports. So tags trigger nothing here.
  push:
    branches: ['**']
  pull_request:
  # The release path fires this when the qualification BODY did not run at the
  # SHA it is about to tag: `verify-exact-ci.sh` requires that step's success as
  # its fourth axis (#103). `qualify` is the operator's explicit "run the body"
  # request: the decision step below runs the body for a dispatch ONLY when it is
  # true, so a dispatch without it is a floor-only rerun that leaves the release
  # oracle still refusing that SHA.
  workflow_dispatch:
    inputs:
      qualify:
        description: 'Force the check-gate-qualification body to run'
        type: boolean
        default: false
  # Weekly, 04:00 KST Sunday (19:00 UTC Saturday). The path filter below means a
  # long run of docs-only pushes never re-proves kill-power, and the things that
  # rot underneath it are not in our diff at all: the ubuntu-latest image, and
  # the movable @v4 major tags on checkout/setup-node/pnpm. --frozen-lockfile
  # pins npm dependencies and neither of those (#99 stage-2 SS4). This run is the
  # ceiling on that drift; it is not evidence about any particular commit.
  schedule:
    - cron: '0 19 * * 6'

env:
  # Run all JS-based actions on Node 24 ahead of GitHub's 2026-06-02 default
  # switch (silences the "Node.js 20 actions are deprecated" annotation while
  # actions/checkout, setup-node, pnpm/action-setup are still on @v4).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The qualification filter reads the two-dot push range GitHub itself
          # documents, so the BASE commit has to exist here. The default depth of
          # 1 does not fetch it, which would trip fail-open 4 on every push and
          # quietly turn the filter off. ~24 MiB of pack, 1.2k commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Push CI owns the FULL deterministic floor (#70 tiering): `pnpm check`
      # is the operator's ≤60s everyday core, while `check:full` adds the
      # hermetic-integration and package/install tiers machine time pays for.
      - run: pnpm run check:full
      # check-gate-qualification left the default local check chains (operator
      # inner-loop cost) — its HEAD is back inside check:full above as
      # check-gate-manifests, and the BODY runs here. CI machine time re-proves
      # the gates' kill-power on a BRANCH push that touched the qualification
      # surface (see the decision step below); a tag push rebuilds nothing,
      # because a tag names a SHA some branch push already built. A release SHA
      # whose push was filtered has NO body here, and verify-exact-ci.sh refuses
      # it by name rather than reading three green job names -- the operator
      # dispatches the body with qualify=true and the oracle then reads that run.
      # Which pushes still owe the body (#103 piece 2). The path set is READ FROM
      # THE MANIFESTS at runtime, so a new mutant subject cannot fall outside the
      # filter without anyone noticing; scripts/check-release-gate-outcomes.ts
      # owns that containment as [QK:QUALIFY-FILTER-COVERS-SUBJECTS], and the
      # five historical CI catches are replayed against this same script.
      - id: qualify-decide
        run: ./scripts/ci-qualify-decide.sh "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_FORCED: ${{ github.event.forced }}
          CI_QUALIFY: ${{ inputs.qualify }}
      # KEY ORDER IS A CONTRACT HERE. `run:` must lead this step. Cell 8a counts the
      # sequence-item form of this exact command and requires exactly one hit --
      # so it must not appear a second time anywhere in this file, comments
      # included -- and the release oracle matches GitHub's rendered step name
      # `Run <command>`, which an `if:` placed first (or any `name:`) would both
      # destroy. YAML mappings are unordered, so `if` sits underneath and both
      # contracts survive.
      - run: ./run.sh check-gate-qualification
        if: steps.qualify-decide.outputs.run_body == 'true'

  # The install surface has its own job because `pnpm run check:full` is a SOURCE-tree
  # floor: it can only ever prove a dev clone works. Every fence bug this repo has shipped —
  # start.sh (0.12.1), the store-doctor (0.12.4), the plugin hook (0.12.5), the agy
  # imprint plus three operator commands (0.12.7) — was green on that floor and dead once
  # installed, because Node refuses type-stripping below node_modules. check-pack-install
  # packs the real tarball, installs it, and drives the bins and commands from under
  # node_modules. It was release-gate-only until 0.12.7, which is precisely why the class
  # kept coming back. ~1 minute.
  install-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./run.sh check-pack-install

  # The artifact CONSUMER lane (#51 C). install-surface above is still a
  # maintainer-shaped proof: the checkout is present, every tree is runner-owned,
  # and the package is installed project-locally. This job hands one candidate
  # tarball, read-only, to a container that has never seen the repo — non-root
  # `npm install -g`, a frozen package directory, and the strict doctor oracle.
  # ENTWURF_REQUIRE_DOCKER=1 is the point of the job: locally a missing Docker is
  # an honest SKIP, but here an unprovable consumer lane must be RED, never a
  # silent pass. ~2 minutes.
  artifact-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ENTWURF_REQUIRE_DOCKER=1 ./run.sh check-install-container

  # The macOS Entwurf-ONLY installation cell (#78's macOS row). This is the
  # "smallest proposed macOS measurement" #86 transferred to #78, implemented as a
  # composition of surfaces that already ship: pack the same candidate the publish
  # path packs, install it, and drive the harness-free operator commands from under
  # node_modules. macos-latest is a Darwin CI image, not an operator physical host:
  # this job needs no borrowed Mac because it certifies the Entwurf-only install
  # surface (CERTIFIED (CI)) and nothing else — the harness rails still need the
  # borrowed Mac.
  #
  # WHY NOT check-pack-install (the install-surface job above). That gate still
  # cannot stand on Darwin — but no longer because of the install fences: this lane
  # opened every install fence to `Linux | Darwin`, so the installers the gate
  # drives no longer die on the platform name. The remaining reason is the GNU
  # coreutils in the gate's own body, which the macOS base image does not ship
  # (sha256sum, `sort -z`, `xargs -0r`).
  #
  # WHAT A GREEN RUN HERE CERTIFIES: the Entwurf-ONLY installation path on macOS
  # — the tarball builds and packs on Darwin, the packed bins resolve and run
  # under the system bash 3.2, the installed MCP bridge boots and lists exactly
  # the seven garden verbs, and the aggregate `setup` composition reaches a
  # COMPUTED verdict with every harness absent while writing no harness or
  # credential state.
  # WHAT IT DOES NOT CERTIFY: Claude / Copilot / OMP / agy wiring, the pi provider
  # rail, any ACP backend, mux, or a single LIVE turn. None of those has a macOS
  # receipt, and this job mints none.
  #
  # REQUIRED as of 0.20.0 (#78), promoted from non-voting. This job's own
  # earlier rule was: "Promoting this to a release axis is a GLG decision
  # after a first physical green." That green happened: run 34303884286 @
  # `70eda03` (2026-09-09), this job green in 65s, all 10 steps success, on
  # this same job body. `continue-on-error` is removed below, so this job's
  # conclusion now feeds the workflow RUN conclusion the same way `check`,
  # `install-surface`, and `artifact-consumer` already do. Its name is added
  # to verify-exact-ci.sh's `required` tuple (:67) and to VERIFY.md's release
  # acceptance table.
  #
  # THE TRADE-OFF IS DELIBERATE. A macOS runner failure -- flaky infra, a
  # macos-latest image change, or a genuine regression in this job's own
  # steps -- now blocks every release cut, Linux included, the same way a red
  # `check`/`install-surface`/`artifact-consumer` already does. What is newly
  # staked is macOS runner availability and image drift, not unproven product
  # code: the steps below are the same Entwurf-only install surface this
  # promotion measured green once.
  #
  # INTERACTION WITH THE EXACT-SHA ORACLE. verify-exact-ci.sh already checks
  # `run.conclusion != success` unconditionally, before it ever loops over
  # `required` job names (:83-84) -- so a red job here now turns that
  # unconditional check red directly, the same path a red Linux job already
  # took; adding this job's name to `required` additionally names it in the
  # per-job loop, but the run-conclusion check alone already catches it.
  #
  # WHAT A GREEN RUN HERE CERTIFIES / DOES NOT CERTIFY IS UNCHANGED BY THIS
  # PROMOTION -- see the two paragraphs above this job's steps. Required
  # status widens WHEN a green macOS run is demanded, never WHAT it proves:
  # Claude/Copilot/OMP/agy wiring, the pi provider rail, any ACP backend, mux,
  # and a single LIVE turn remain uncertified by this job on any platform.
  #
  # WHY IT LIVES IN ci.yml AND NOT ITS OWN WORKFLOW FILE. A separate workflow file
  # would also keep a red off this run -- the release oracle only ever selects
  # ci.yml runs (verify-exact-ci.sh:26-33) -- but it buys that by making the macOS
  # cell INVISIBLE in the very run the operator and the oracle read at cut time,
  # and a dispatch-recovered SHA would then carry no macOS cell at all. The two
  # reasons above plus that visibility all kept holding through the promotion that
  # has since landed; the one-time cost of moving files did not, so it is
  # deliberately NOT recorded here as a reason. Reopen the separate-workflow design
  # on exactly one observed event and no earlier: a fail-closed rupture. (The second
  # trigger this paragraph once named — a green that earns promotion — is spent:
  # that promotion landed above and the reasons still held, so it opens nothing.)
  # Its price (rewriting the ci.yml-anchored `on:` reader at
  # scripts/check-release-gate-outcomes.ts:751, a second mutant subject for the
  # new file, and one qualification pass) is justified by that observation, never
  # prepaid ahead of it.
  macos-install-surface:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same pack invocation the publish gate uses (run.sh:3238), dist lock
      # included, so the Darwin evidence is about the shipped pack path rather
      # than a CI-only variant. prepack -> build-bridge -> tsc runs here, which is
      # itself the first thing macOS has never been measured doing.
      - name: pack the candidate
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          bash scripts/with-dist-lock.sh npm pack --dry-run=false --pack-destination "$RUNNER_TEMP/pack"
      # A consumer root outside the checkout, so every command below resolves
      # through node_modules and takes the installed branch of the location seam
      # (start.sh dist, run_ts compiled twin, setup mode=installed).
      - name: install the packed candidate into a clean consumer root
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          printf '%s\n' '{ "name": "entwurf-macos-consumer", "version": "0.0.0", "private": true }' \
            > "$RUNNER_TEMP/consumer/package.json"
          cd "$RUNNER_TEMP/consumer"
          npm install --ignore-scripts "$RUNNER_TEMP"/pack/junghanacs-entwurf-*.tgz
      - name: packed entwurf --help
        run: '"$RUNNER_TEMP/consumer/node_modules/.bin/entwurf" --help'
      - name: packed entwurf check-bridge
        run: '"$RUNNER_TEMP/consumer/node_modules/.bin/entwurf" check-bridge'
      # All-harness-absent `setup`, a SUBSET of the cells the Linux row asserts at
      # run.sh:3785-3841, through the same five documented presence seams. What the
      # #86 row names is covered -- five SKIPs, a computed verdict, zero harness and
      # credential writes -- while two Linux-row cells are deliberately not repeated
      # here: the no-pnpm-bootstrap grep and the `bins: PASS` grep, both of which
      # assert platform-neutral product behaviour the Linux gate already owns. The
      # assertions are inline rather than a scripts/ gate on purpose: a macOS-only
      # script is unrunnable and unqualifiable on the Linux oracle, so it would be
      # a second, permanently untested implementation of that row. Fold these into
      # one portable gate when a SECOND macOS cell needs them, not before.
      - name: all-harness-absent entwurf setup
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/setuphome"
          P="$RUNNER_TEMP/setupproj"
          mkdir -p "$H/.pi/agent" "$P"
          printf '{ "anthropic": { "type": "oauth", "access": "ci-token" } }\n' > "$H/.pi/agent/auth.json"
          cp "$H/.pi/agent/auth.json" "$RUNNER_TEMP/auth.before"
          out=$(HOME="$H" XDG_DATA_HOME="$H/.local/share" XDG_STATE_HOME="$H/.local/state" \
            XDG_CACHE_HOME="$H/.cache" XDG_CONFIG_HOME="$H/.config" PI_CODING_AGENT_DIR="$H/.pi/agent" \
            PI_BIN="$RUNNER_TEMP/definitely-absent" CLAUDE_BIN="$RUNNER_TEMP/definitely-absent" \
            AGY_BIN="$RUNNER_TEMP/definitely-absent" COPILOT_BIN="$RUNNER_TEMP/definitely-absent" \
            OMP_BIN="$RUNNER_TEMP/definitely-absent" \
            "$RUNNER_TEMP/consumer/node_modules/.bin/entwurf" setup "$P" 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | head -n 1 | grep -q "mode: installed package"
          for probe in "pi: SKIP" "claude: SKIP" "agy: SKIP" "copilot: SKIP" "omp: SKIP"; do
            printf '%s\n' "$out" | grep -q "$probe"
          done
          printf '%s\n' "$out" | grep -q "core: PASS"
          printf '%s\n' "$out" | grep -q "result: green (computed from the component outcomes above)"
          # Zero harness/credential writes. `cmp` instead of a hash: macOS ships no
          # sha256sum, and byte equality is the actual contract.
          test ! -e "$P/.pi"
          test ! -e "$H/.pi/agent/settings.json"
          test ! -e "$H/.gemini"
          test ! -e "$H/.copilot"
          test ! -e "$H/.pi/agent/auth.json.bak"
          cmp -s "$RUNNER_TEMP/auth.before" "$H/.pi/agent/auth.json"
