name: wsl2-install-surface (experimental)

# #78 WSL2 cells 1+2 — EXPERIMENTAL, non-voting by construction. The release oracle and
# every gate read only ci.yml runs (verify-exact-ci.sh:26-34, qualification-gh.ts:33), and
# ci.yml's job list is pinned to the four required jobs ([QK:CI-COMPOSITE-STEPS-PINNED]),
# so this cell lives in its own file: a red here blocks no cut, and its run conclusion is
# its honest verdict — no continue-on-error, no retry, no rerun.
#
# WHAT A GREEN RUN MEASURES (experimental, non-voting): the Entwurf-only install surface
# inside a real WSL2 guest on a GitHub-hosted Windows runner — this run's packed tgz
# (producer -> host -> guest digest equal), installed under a guest-native Node 24,
# `--help`, `check-bridge`, and an all-harness-absent `setup` that leaves the protected
# auth/harness state unchanged (cell 1); then a zero-token Pi citizen in the same guest —
# an SRI-pinned Pi wired by `setup`, one V3 record, its gid-keyed control socket and an
# alive `peer-facts` join, with only `get_state` sent (cell 2).
# WHAT IT DOES NOT MEASURE OR CLAIM: native Windows, any other harness rail, login or a
# model turn, delivery, fresh/resume, mux/tmux, Herdr, or a physical user machine. A CI
# runner is not a host.
#
# Supply pins are digests read from the projects' official HTTPS checksum files
# (releases.ubuntu.com SHA256SUMS, nodejs.org SHASUMS256.txt, the npm registry's integrity
# for Pi); their GPG signatures are NOT verified here. Contract and receipts: #78.
#
# It runs when this file changes on main, or by manual dispatch; product drift between
# edits is measured by dispatch, not on every push.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wsl2-install-surface.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The producer. Same pack invocation as the publish gate and the macOS cell, run once in
  # THIS trial. It is not the tgz the ci.yml jobs pack internally, nor any release or
  # registry artifact; the digest claim below reaches producer -> host -> guest only.
  wsl2-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pack the candidate and record its digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          bash scripts/with-dist-lock.sh npm pack --dry-run=false --pack-destination "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/pack"
          test "$(ls junghanacs-entwurf-*.tgz | wc -l)" -eq 1
          sha256sum junghanacs-entwurf-*.tgz | tee pack.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wsl2-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error

  # The consumer. No checkout: everything the guest runs is this file's own LF heredoc.
  wsl2-install-surface:
    needs: wsl2-pack
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DISTRO: entwurf-wsl2
      UBUNTU_WSL_URL: https://releases.ubuntu.com/24.04.5/ubuntu-24.04.5-wsl-amd64.wsl
      UBUNTU_WSL_SHA256: bb415d824822c4b878125729af451a5d18fb13d1cf5cbed9a7393ad64ac6039e
      NODE_VERSION: v24.18.1
      NODE_DIST: node-v24.18.1-linux-x64
      NODE_SHA256: 9f5eb6ac21845a66c493c91a253b1da32fd684e89e9b7202d4936982336be4ca
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wsl2-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate

      - name: host digest equals the producer digest
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$RUNNER_TEMP")/candidate"
          cat pack.sha256
          sha256sum -c pack.sha256

      - name: fetch and verify the pinned Ubuntu WSL image and guest Node
        run: |
          set -euo pipefail
          S="$(cygpath -u "$RUNNER_TEMP")/supply"
          mkdir -p "$S"
          # curl is a native Windows program: hand it a Windows destination, never a Git Bash path.
          type -a curl; curl --version | sed -n '1p'
          echo "destination: $(cygpath -w "$S")"; ls -ld "$S"
          curl -fsSL -o "$(cygpath -w "$S/ubuntu.wsl")" "$UBUNTU_WSL_URL"
          curl -fsSL -o "$(cygpath -w "$S/$NODE_DIST.tar.gz")" "https://nodejs.org/dist/$NODE_VERSION/$NODE_DIST.tar.gz"
          printf '%s  %s\n' "$UBUNTU_WSL_SHA256" "$S/ubuntu.wsl" "$NODE_SHA256" "$S/$NODE_DIST.tar.gz" | sha256sum -c

      - name: install the distro as WSL2
        run: |
          set -euo pipefail
          wsl.exe --version | tr -d '\000\r' || true
          # Captured, not piped into grep -q: `wsl --help` need not exit 0, and an early grep
          # exit would SIGPIPE the producer under pipefail.
          help="$(wsl.exe --help 2>&1 | tr -d '\000\r' || true)"
          if ! grep -q -- '--from-file' <<<"$help"; then
            echo "wsl.exe on this image has no --from-file; no fallback" >&2
            exit 1
          fi
          wsl.exe --set-default-version 2 | tr -d '\000\r'
          wsl.exe --install --from-file "$(cygpath -w "$(cygpath -u "$RUNNER_TEMP")/supply/ubuntu.wsl")" \
            --no-launch --name "$DISTRO" | tr -d '\000\r'

      - name: write the guest script (LF heredoc, no checkout)
        run: |
          set -euo pipefail
          G="$(cygpath -u "$RUNNER_TEMP")/guest.sh"
          cat > "$G" <<'GUEST'
          # Runs as root inside the WSL2 guest. $1 = the runner temp root as a Windows path.
          set -euo pipefail
          echo "guest script sha256: $(sha256sum "$0" | cut -d' ' -f1)"
          red() { echo "RED: $*" >&2; exit 1; }

          # W1-W4 kernel oracle, first and fail-closed.
          [ "$(uname -s)" = Linux ] || red "W1 uname -s is not Linux"
          echo "uname -r: $(uname -r)"
          case "$(cat /proc/sys/kernel/osrelease)" in
            *microsoft-standard-WSL2*) ;;
            *) red "W2 osrelease is not microsoft-standard-WSL2 (if the host VERSION row says 2, classify as oracle string drift)" ;;
          esac
          [ -n "${WSL_DISTRO_NAME:-}" ] || red "W3 WSL_DISTRO_NAME unset"
          [ "$WSL_DISTRO_NAME" = "$EXPECT_DISTRO" ] || red "W3 running in '$WSL_DISTRO_NAME', expected '$EXPECT_DISTRO'"
          ls /proc/sys/fs/binfmt_misc/WSLInterop* >/dev/null 2>&1 || red "W3 no WSLInterop binfmt marker"
          WSL_EXE=/mnt/c/Windows/System32/wsl.exe
          "$WSL_EXE" --version | tr -d '\000\r' || true
          ver="$("$WSL_EXE" --list --verbose | tr -d '\000\r' | awk -v d="$WSL_DISTRO_NAME" '{ sub(/^\*/, ""); if ($1 == d) print $NF }')"
          [ "$ver" = 2 ] || red "W4 host lists $WSL_DISTRO_NAME at VERSION '$ver', expected 2"
          echo "--- /etc/wsl.conf"; cat /etc/wsl.conf 2>/dev/null || echo "(absent)"

          # Guest-ext4 scratch; the product steps see only guest Node and Linux standard paths.
          HOST_TEMP="$(wslpath -u "$1")"
          S=/var/tmp/entwurf-wsl2-cell
          rm -rf "$S"; mkdir -p "$S"
          echo "W5 fstype host=$(stat -f -c %T "$HOST_TEMP") scratch=$(stat -f -c %T "$S")"
          cp "$HOST_TEMP"/candidate/junghanacs-entwurf-*.tgz "$HOST_TEMP/candidate/pack.sha256" "$S/"
          cp "$HOST_TEMP/supply/$NODE_DIST.tar.gz" "$S/"
          (cd "$S" && sha256sum -c pack.sha256)
          printf '%s  %s\n' "$NODE_SHA256" "$S/$NODE_DIST.tar.gz" | sha256sum -c
          tar -xzf "$S/$NODE_DIST.tar.gz" -C /opt
          export PATH="/opt/$NODE_DIST/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          export npm_config_cache="$S/npm-cache"
          node -v
          [ "$(node -v)" = "$NODE_VERSION" ] || red "guest node is $(node -v), expected $NODE_VERSION"
          command -v python3 >/dev/null || red "python3 absent in the guest image (a setup prerequisite)"
          python3 --version

          # Every product command runs against a disposable run home, never the guest's /root and
          # never setup's own $H below (a write there would be blamed on setup).
          R="$S/runhome"
          mkdir -p "$R/.config" "$R/.local/share" "$R/.local/state" "$R/.cache" "$R/.pi/agent"
          export HOME="$R" XDG_CONFIG_HOME="$R/.config" XDG_DATA_HOME="$R/.local/share" \
            XDG_STATE_HOME="$R/.local/state" XDG_CACHE_HOME="$R/.cache" PI_CODING_AGENT_DIR="$R/.pi/agent"
          mkdir -p "$S/consumer"
          printf '%s\n' '{ "name": "entwurf-wsl2-consumer", "version": "0.0.0", "private": true }' > "$S/consumer/package.json"
          (cd "$S/consumer" && npm install --ignore-scripts "$S"/junghanacs-entwurf-*.tgz)
          E="$S/consumer/node_modules/.bin/entwurf"

          # W6: what is actually invoked resolves inside the guest; an empty answer is red.
          for p in "$(command -v node)" "$(command -v npm)" "$(command -v python3)" "$E"; do
            [ -n "$p" ] && [ -e "$p" ] || red "W6 a product command did not resolve"
            r="$(readlink -f "$p")"
            echo "W6 $p -> $r"
            case "$r" in /mnt/*) red "W6 $p resolves through Windows: $r" ;; esac
          done

          "$E" --help
          "$E" check-bridge

          # All-harness-absent setup: the macOS block plus the Linux row's sixth probe (codex).
          H="$S/setuphome"; P="$S/setupproj"; X="$S/definitely-absent"
          mkdir -p "$H/.pi/agent" "$P"
          printf '{ "anthropic": { "type": "oauth", "access": "ci-token" } }\n' > "$H/.pi/agent/auth.json"
          cp "$H/.pi/agent/auth.json" "$S/auth.before"
          out=$(HOME="$H" XDG_DATA_HOME="$H/.local/share" XDG_STATE_HOME="$H/.local/state" \
            XDG_CACHE_HOME="$H/.cache" XDG_CONFIG_HOME="$H/.config" PI_CODING_AGENT_DIR="$H/.pi/agent" \
            PI_BIN="$X" CLAUDE_BIN="$X" AGY_BIN="$X" COPILOT_BIN="$X" OMP_BIN="$X" CODEX_BIN="$X" \
            "$E" setup "$P" 2>&1) || { printf '%s\n' "$out"; red "setup exited nonzero"; }
          printf '%s\n' "$out"
          grep -q "mode: installed package" <<<"$(head -n 1 <<<"$out")" || red "setup did not name its mode first"
          for probe in "pi: SKIP" "claude: SKIP" "agy: SKIP" "copilot: SKIP" "omp: SKIP" "codex: SKIP"; do
            grep -q "$probe" <<<"$out" || red "setup missing '$probe'"
          done
          grep -q "core: PASS" <<<"$out" || red "setup core not PASS"
          grep -q "result: green (computed from the component outcomes above)" <<<"$out" || red "setup result not green"
          # The no-write axis: protected auth/harness state unchanged (not "setup writes nothing").
          test ! -e "$P/.pi"
          test ! -e "$H/.pi/agent/settings.json"
          test ! -e "$H/.gemini"
          test ! -e "$H/.copilot"
          test ! -e "$H/.codex"
          test ! -e "$H/.pi/agent/auth.json.bak"
          cmp -s "$S/auth.before" "$H/.pi/agent/auth.json"
          echo "wsl2-install-surface: PASS"
          GUEST
          if grep -q $'\r' "$G"; then echo "guest script carries CR bytes" >&2; exit 1; fi
          sha256sum "$G"

      - name: run the guest script inside WSL2
        # A first-launch OOBE waiting on stdin would otherwise surface only as the job timeout.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          # MSYS_NO_PATHCONV only here: these wsl.exe argv carry Linux paths Git Bash must not rewrite.
          G="$(MSYS_NO_PATHCONV=1 wsl.exe -d "$DISTRO" -u root --exec wslpath -u "$(cygpath -w "$T/guest.sh")" | tr -d '\r')"
          test -n "$G"
          MSYS_NO_PATHCONV=1 wsl.exe -d "$DISTRO" -u root --exec /usr/bin/env \
            EXPECT_DISTRO="$DISTRO" NODE_VERSION="$NODE_VERSION" NODE_DIST="$NODE_DIST" NODE_SHA256="$NODE_SHA256" \
            /bin/bash "$G" "$(cygpath -w "$T")"

      # Cell 2 (#78): a zero-token Pi citizen in the same guest. Its own step and verdict, so a
      # red here never paints cell 1, and a red cell 1 skips it (skipped is not green).
      - name: cell 2 — zero-token pi citizen inside WSL2
        timeout-minutes: 10
        env:
          PI_VERSION: 1.4.0
          PI_INTEGRITY: sha512-Z41LpZ3yYHSC/UUps6Mr39UMFPwH8elhJBG9DY1P7kuzsE5qSK/6eMj2EHzO5evJRQWLbKSqUMw+4nCNtIyiQg==
        run: |
          set -euo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          G2="$T/guest2.sh"
          cat > "$G2" <<'GUEST2'
          # Cell 2, as root inside the WSL2 guest, after cell 1 left its consumer install behind.
          set -euo pipefail
          echo "cell 2 script sha256: $(sha256sum "$0" | cut -d' ' -f1)"
          red() { echo "RED: $*" >&2; exit 1; }
          S=/var/tmp/entwurf-wsl2-cell
          E="$S/consumer/node_modules/.bin/entwurf"
          [ -x "$E" ] || red "cell 1's consumer install is absent"

          # Own sandbox, short enough for sun_path; the driver's roots and the product's must agree.
          unset ENTWURF_META_SESSIONS_DIR ENTWURF_META_MAILBOX_DIR ENTWURF_META_RECEIVERS_DIR ENTWURF_META_SENDERS_DIR PI_BIN
          export HOME=/var/tmp/c2h
          P=/var/tmp/c2p
          rm -rf "$HOME" "$P"
          mkdir -p "$HOME/.config" "$HOME/.local/share" "$HOME/.local/state" "$HOME/.cache" "$HOME/.pi/agent" "$P"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share" XDG_STATE_HOME="$HOME/.local/state" \
            XDG_CACHE_HOME="$HOME/.cache" PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export npm_config_cache="$S/npm-cache"
          export PATH="$S/pi-prefix/bin:/opt/$NODE_DIST/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          echo "W5 cell-2 home fstype=$(stat -f -c %T "$HOME")"

          # Operator-installed pi, exact version, its tarball checked against the pinned SRI (base64).
          rm -rf "$S/pi-pack"; mkdir -p "$S/pi-pack"
          (cd "$S/pi-pack" && npm pack "@earendil-works/pi-coding-agent@$PI_VERSION")
          [ "$(ls "$S"/pi-pack/*.tgz | wc -l)" -eq 1 ] || red "npm pack did not yield exactly one tarball"
          PT="$(ls "$S"/pi-pack/*.tgz)"
          got="sha512-$(node -e 'process.stdout.write(require("crypto").createHash("sha512").update(require("fs").readFileSync(process.argv[1])).digest("base64"))' "$PT")"
          echo "pi tarball integrity: $got"
          [ "$got" = "$PI_INTEGRITY" ] || red "SUPPLY: pi tarball integrity differs from the pin"
          npm install -g --prefix "$S/pi-prefix" "$PT"
          pibin="$(command -v pi || true)"
          [ -n "$pibin" ] || red "pi did not resolve on PATH"
          echo "W6 pi $pibin -> $(readlink -f "$pibin")"
          case "$(readlink -f "$pibin")" in "$S/pi-prefix"/*) ;; *) red "pi resolves outside the guest prefix" ;; esac
          pi --version

          # setup with pi PRESENT: project + user-scope wiring, every other harness absent.
          X="$S/definitely-absent"
          out=$(CLAUDE_BIN="$X" AGY_BIN="$X" COPILOT_BIN="$X" OMP_BIN="$X" CODEX_BIN="$X" "$E" setup "$P" 2>&1) \
            || { printf '%s\n' "$out"; red "setup exited nonzero"; }
          printf '%s\n' "$out"
          grep -q "pi: PASS" <<<"$out" || red "setup did not wire pi"
          for probe in "claude: SKIP" "agy: SKIP" "copilot: SKIP" "omp: SKIP" "codex: SKIP"; do
            grep -q "$probe" <<<"$out" || red "setup missing '$probe'"
          done
          grep -q "result: green (computed from the component outcomes above)" <<<"$out" || red "setup result not green"

          # The fixture-[7] driver (smoke-herdr-raw-install-live.sh), guest-inline.
          cat > "$S/cell2-drive.mjs" <<'DRIVER_EOF'
          import { spawn } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";
          import { spawnSync } from "node:child_process";
          import net from "node:net";

          const HOME = process.env.HOME;
          const SOCKET_DIR = path.join(HOME, ".pi", "entwurf-control");
          const META_DIR = path.join(HOME, ".pi", "agent", "meta-sessions");
          const ENTWURF_BIN = process.argv[2];
          // The ENTRY POINT is an argument, because there are two of them and they are different
          // claims. `pi --entwurf-control` proves the WIRING; `entwurf pi` proves the LAUNCHER a user
          // received from npm. One program, so neither claim drifts away from the other.
          const LABEL = process.argv[3];
          const [COMMAND, ...COMMAND_ARGS] = process.argv.slice(4);

          let bad = 0;
          const ok = (m) => console.log("  ok    " + m);
          const no = (m) => { console.log("  FAIL  " + m); bad = 1; };
          const ls = (dir) => { try { return fs.readdirSync(dir); } catch { return []; } };

          console.log(`  ENTRY  ${LABEL}: ${COMMAND} ${COMMAND_ARGS.join(" ")}`);
          const child = spawn(COMMAND, COMMAND_ARGS, { stdio: ["pipe", "pipe", "pipe"] });
          let stderr = "";
          child.stderr.on("data", (d) => { stderr += d.toString(); });

          let buf = "";
          let settled = false;
          const extensionErrors = [];
          let agentStartSeen = false;

          // WSL2 cell 2: the fixture's 300 ms TERM-then-exit carried no evidence that pi had exited.
          // This one waits for its OWN child (exit listener attached before signalling), escalates
          // once to SIGKILL on that child only, and reports how it ended. No other process is touched.
          const done = (code) => {
            if (settled) return;
            settled = true;
            try { child.stdin.end(); } catch { /* best-effort */ }
            const exited = () => child.exitCode !== null || child.signalCode !== null;
            const waitExit = (ms) => new Promise((resolve) => {
              if (exited()) { resolve(true); return; }
              const t = setTimeout(() => resolve(false), ms);
              child.once("exit", () => { clearTimeout(t); resolve(true); });
            });
            const finish = (gone) => {
              console.log(`  EXIT  pi exitCode=${child.exitCode} signal=${child.signalCode}`);
              if (!gone) no("pi did not exit after SIGTERM and one SIGKILL");
              // Evidence, not a billing proof: only get_state was sent, and no agent_start was seen
              // from spawn through teardown.
              agentStartSeen ? no("a model turn started — this cell is supposed to cost zero tokens") : ok("no agent_start observed through teardown (only get_state was sent)");
              process.exit(code || bad ? 1 : 0);
            };
            if (exited()) { finish(true); return; }
            (async () => {
              const first = waitExit(10_000);
              try { child.kill("SIGTERM"); } catch { /* best-effort */ }
              let gone = await first;
              if (!gone) {
                no("pi did not exit within 10s of SIGTERM — one SIGKILL to this child");
                try { child.kill("SIGKILL"); } catch { /* best-effort */ }
                gone = await waitExit(5_000);
              }
              finish(gone);
            })();
          };

          /** C2: a native AF_UNIX connect to the citizen socket while pi is alive, settled before peers. */
          const probeSocket = (rec) => new Promise((resolve) => {
            const sock = path.join(SOCKET_DIR, `${rec.gardenId}.sock`);
            let st;
            try { st = fs.statSync(sock); } catch (err) { no(`stat ${sock}: ${err.message}`); resolve(); return; }
            st.isSocket() ? ok(`${rec.gardenId}.sock is a socket inode`) : no(`${sock} is not a socket inode`);
            const c = net.connect(sock);
            const timer = setTimeout(() => { no(`native connect to ${sock} did not settle within 5s`); c.destroy(); resolve(); }, 5000);
            c.once("connect", () => { clearTimeout(timer); ok("a native AF_UNIX connect to the citizen socket succeeds while pi is alive"); c.destroy(); resolve(); });
            c.once("error", (err) => { clearTimeout(timer); no(`native connect to ${sock} failed: ${err.message}`); c.destroy(); resolve(); });
          });

          const observe = (sessionId) => {
            const sockets = ls(SOCKET_DIR).filter((f) => f.endsWith(".sock"));
            const recordFiles = ls(META_DIR).filter((f) => f.endsWith(".meta.json"));
            const records = recordFiles.map((f) => {
              try { return { file: f, record: JSON.parse(fs.readFileSync(path.join(META_DIR, f), "utf8")) }; } catch { return null; }
            }).filter((r) => r !== null);
            const mine = records.filter((r) => r.record.nativeSessionId === sessionId);
            console.log(`  PI    nativeSessionId=${sessionId}`);
            console.log(`  STORE records=${records.length} sockets=${JSON.stringify(sockets)}`);

            if (mine.length === 1) ok("exactly one V3 record claims this pi session");
            else { no(`${mine.length} records claim ${sessionId} — the wired extension did not birth exactly one citizen`); return null; }

            const rec = mine[0].record;
            // WSL2 cell 2: the SELECTED pair's own filename must be its body's address.
            mine[0].file === `${rec.gardenId}.meta.json`
              ? ok(`the selected record file is named for its own gardenId (${mine[0].file})`)
              : no(`selected record file ${mine[0].file} does not match its body gardenId ${rec.gardenId}`);
            console.log(`  RECORD gardenId=${rec.gardenId} backend=${rec.backend} schemaVersion=${rec.schemaVersion} model=${rec.model} transcriptPath=${JSON.stringify(rec.transcriptPath)}`);
            rec.schemaVersion === 3 && rec.backend === "pi"
              ? ok("the record is V3 with backend:\"pi\"")
              : no(`record is schemaVersion=${rec.schemaVersion} backend=${rec.backend}`);
            // The address is the record's. A gardenId equal to pi's own id would mean the id
            // authority moved back into the harness — the split #50 C2 exists to hold.
            typeof rec.gardenId === "string" && /^\d{8}T\d{6}-[0-9a-f]{6}$/.test(rec.gardenId) && rec.gardenId !== sessionId
              ? ok(`the record minted the address, not pi (${rec.gardenId})`)
              : no(`gardenId ${JSON.stringify(rec.gardenId)} is not a record-minted address distinct from pi's id`);
            // A 0-token birth writes no session file, so a resume target here would be a phantom.
            rec.transcriptPath === null ? ok("0-token birth carries transcriptPath=null (no phantom resume target)") : no(`transcriptPath=${JSON.stringify(rec.transcriptPath)} for a session with no turn`);

            sockets.includes(`${rec.gardenId}.sock`)
              ? ok(`a control socket is open, keyed on the record gardenId (${rec.gardenId}.sock)`)
              : no(`no ${rec.gardenId}.sock among ${JSON.stringify(sockets)} — the citizen has an address but no rail`);
            sockets.some((s) => s === `${sessionId}.sock` || /^[0-9a-f]{8}-[0-9a-f]{4}-/.test(s))
              ? no(`a socket carries pi's own session id: ${JSON.stringify(sockets)}`)
              : ok("no socket carries pi's session id");
            return rec;
          };

          /** peer-facts from the INSTALLED bin, while pi is still alive. */
          const askPeers = (rec) => {
            const run = spawnSync(ENTWURF_BIN, ["peer-facts"], { encoding: "utf8", timeout: 30_000 });
            if (run.error) { no(`installed \`entwurf peer-facts\` did not complete: ${run.error.message}`); return; }
            if (run.status !== 0) { no(`installed \`entwurf peer-facts\` exit ${run.status}: ${(run.stderr ?? "").trim().slice(0, 300)}`); return; }
            let payload;
            try { payload = JSON.parse(run.stdout); } catch (err) { no(`peer-facts output is not JSON: ${err.message}`); return; }
            const peers = Array.isArray(payload?.peers) ? payload.peers : null;
            if (peers === null) { no("peer-facts payload has no `peers` array"); return; }
            const row = peers.find((p) => p.gardenId === rec.gardenId);
            console.log(`  PEERS total=${peers.length} mine=${row ? JSON.stringify(row) : "<absent>"}`);
            if (!row) { no(`peer-facts does not report ${rec.gardenId} — the citizen exists on disk and not in the listing`); return; }
            ok(`the installed \`entwurf peer-facts\` reports this citizen (backend=${row.backend})`);
            // Liveness is a FACT here, not a dispatch decision: the process is up and the socket is
            // bound, so anything but `alive` means the probe cannot see a rail that exists.
            row.liveness === "alive" ? ok("peer-facts reports liveness=alive while the session is up") : no(`peer-facts reports liveness=${row.liveness} for a running session`);
          };

          child.stdout.on("data", (d) => {
            buf += d.toString();
            let i;
            while ((i = buf.indexOf("\n")) >= 0) {
              const line = buf.slice(0, i);
              buf = buf.slice(i + 1);
              if (!line.trim()) continue;
              let evt;
              try { evt = JSON.parse(line); } catch { continue; }
              if (evt.type === "agent_start") agentStartSeen = true;
              if (evt.type === "extension_error") extensionErrors.push({ path: evt.extensionPath, error: evt.error });
              if (evt.type !== "response" || evt.command !== "get_state") continue;
              const sessionId = evt.data?.sessionId ?? null;
              if (typeof sessionId !== "string") { no(`get_state returned no sessionId: ${line.slice(0, 300)}`); done(bad || 1); return; }
              extensionErrors.length === 0
                ? ok("the wired extension loaded with no extension_error")
                : no(`extension errors: ${JSON.stringify(extensionErrors).slice(0, 400)}`);
              const rec = observe(sessionId);
              const kids = (spawnSync("ps", ["-o", "pid=,args=", "--ppid", String(child.pid)], { encoding: "utf8" }).stdout ?? "")
                .split("\n").map((l) => l.trim().slice(0, 160)).filter(Boolean);
              console.log(`  CHILD pi pid=${child.pid} children=${JSON.stringify(kids)}`);
              // Order is fixed: connect settles, THEN peers, THEN teardown (never a connect racing done).
              (rec ? probeSocket(rec).then(() => askPeers(rec)) : Promise.resolve()).then(() => done(bad));
              return;
            }
          });

          child.on("error", (err) => { no(`pi failed to spawn: ${err.message}`); done(1); });
          child.on("exit", (code) => {
            if (settled) return;
            no(`${LABEL}: the session exited ${code} before answering get_state — stderr: ${stderr.trim().slice(0, 600)}`);
            done(1);
          });

          setTimeout(() => { child.stdin.write(`${JSON.stringify({ type: "get_state", id: "g1" })}\n`); }, 500);
          setTimeout(() => { if (!settled) { no("pi did not answer get_state within 60s"); done(1); } }, 60_000);
          DRIVER_EOF
          drv=0
          (cd "$P" && node "$S/cell2-drive.mjs" "$E" "the setup wiring" pi --entwurf-control --mode rpc) || drv=$?

          # Observations, never cleanup claims.
          echo "--- control-socket dir after exit"; ls -la "$HOME/.pi/entwurf-control" 2>&1 || true
          if [ -e "$HOME/.pi/agent/auth.json" ]; then
            echo "auth.json present (pi wrote an auth file; that is not a login): $(stat -c '%s bytes mode %a' "$HOME/.pi/agent/auth.json")"
            node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log("auth.json keys:", JSON.stringify(Object.keys(j)))' "$HOME/.pi/agent/auth.json" || true
          else
            echo "auth.json absent"
          fi

          # Residue under THIS cell's own install paths only; nothing is killed here.
          # pgrep: 0 = a match, 1 = none, anything else = the check itself could not run.
          rc=0; pgrep -af -- "$S/pi-prefix" || rc=$?
          case "$rc" in
            0) red "a process from this cell's pi install is still running" ;;
            1) echo "no process remains under $S/pi-prefix" ;;
            *) red "pgrep could not check for residue (exit $rc)" ;;
          esac
          # The consumer bridge is observed, not asserted.
          rc=0; pgrep -af -- "$S/consumer/node_modules/@junghanacs/entwurf" || rc=$?
          echo "observation: consumer-path processes after teardown (pgrep exit $rc)"
          [ "$drv" -eq 0 ] || red "the fixture driver reported FAIL (rc=$drv)"
          echo "wsl2-cell2-zero-token-pi-citizen: PASS"
          GUEST2
          if grep -q $'\r' "$G2"; then echo "cell 2 script carries CR bytes" >&2; exit 1; fi
          sha256sum "$G2"
          G="$(MSYS_NO_PATHCONV=1 wsl.exe -d "$DISTRO" -u root --exec wslpath -u "$(cygpath -w "$G2")" | tr -d '\r')"
          test -n "$G"
          MSYS_NO_PATHCONV=1 wsl.exe -d "$DISTRO" -u root --exec /usr/bin/env \
            NODE_DIST="$NODE_DIST" PI_VERSION="$PI_VERSION" PI_INTEGRITY="$PI_INTEGRITY" \
            /bin/bash "$G"

      # The most useful single fact in a red run: collected whatever happened above.
      - name: host-side WSL diagnostics and VERSION row
        if: always()
        run: |
          # The runner forces bash -e; turn it off so every diagnostic line survives a failure,
          # and keep the one verdict below as an explicit exit.
          set +e -uo pipefail
          wsl.exe --version | tr -d '\000\r'
          wsl.exe --list --verbose | tr -d '\000\r'
          ver="$(wsl.exe --list --verbose | tr -d '\000\r' | awk -v d="$DISTRO" '{ sub(/^\*/, ""); if ($1 == d) print $NF }')"
          echo "host VERSION for $DISTRO: '$ver'"
          [ "$ver" = 2 ] || exit 1
